info:
  name: 03 Create Petstore REST Order
  type: http
  seq: 3
http:
  method: POST
  url: "{{petstoreUrl}}/store/order"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "id": 9001,
        "petId": 1,
        "quantity": 2,
        "status": "placed",
        "complete": true
      }
  auth:
    type: bearer
    token: "{{capToken}}"
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: after-response
      code: |-
        bru.setVar("restOrderId", String(res.body.id));
    - type: tests
      code: |-
        test("REST-Auftrag im Petstore angelegt", function() {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(9001);
        });
settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
