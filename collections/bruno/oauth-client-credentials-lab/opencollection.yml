opencollection: 1.0.0
info:
  name: OAuth Client Credentials Lab (M2M)
config:
  proxy:
    inherit: true
request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{tokenUrl}}"
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    tokenConfig:
      id: m2mToken
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
