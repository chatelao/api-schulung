info:
  name: Custom CA Server TLS (8444)
  type: http
  seq: 1
  tags:
    - m07
    - tls
http:
  method: GET
  url: "{{tlsURL}}/headers"
  auth: inherit
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("Custom CA Server-TLS erfolgreich", function() {
          expect(res.status).to.equal(200);
          expect(res.body.headers["X-Tls-Mode"][0]).to.equal("server-tls-custom-ca");
        });
settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
