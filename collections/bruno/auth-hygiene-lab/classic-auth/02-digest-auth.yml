info:
  name: HTTP Digest Auth
  type: http
  seq: 2
  tags:
    - m05
    - auth
http:
  method: GET
  url: "{{httpbinURL}}/digest-auth/auth/{{basicUser}}/{{basicPass}}"
  auth:
    type: digest
    username: "{{basicUser}}"
    password: "{{basicPass}}"
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("Digest Auth erfolgreich", function() {
          expect(res.status).to.equal(200);
          expect(res.body.authorized).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
