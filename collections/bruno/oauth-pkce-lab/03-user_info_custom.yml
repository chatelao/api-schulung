info:
  name: user_info_custom
  type: http
  seq: 3
http:
  method: GET
  url: "{{userInfoUrl}}"
  headers:
    - name: Authorization
      value: "Bearer {{$oauth2.keycloakPkce.access_token}}"
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        const token = bru.getOauth2CredentialVar("keycloakPkce", "access_token");
        if (token) {
          req.setHeader("Authorization", `Bearer ${token}`);
        }
    - type: after-response
      code: |-
        if (res.status === 401) {
          // Verwirft gecachtes Token fuer erneuten Abruf beim naechsten Request
          bru.resetOauth2Credential("keycloakPkce");
        }
    - type: tests
      code: |-
        test("Custom Token Injection & 401-Reset-Pattern", function() {
          expect(res.status).to.equal(200);
          expect(res.body.email).to.be.a("string");
        });
settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
