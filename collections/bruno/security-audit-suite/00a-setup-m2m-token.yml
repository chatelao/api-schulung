info:
  name: "00a Setup: Fetch Valid M2M Token for Audit"
  type: http
  seq: 1
  tags:
    - audit
    - setup
http:
  method: POST
  url: "{{kcBaseUrl}}/token"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: client_credentials
  auth:
    type: basic
    username: "{{m2mClientId}}"
    password: "{{m2mClientSecret}}"
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: after-response
      code: |-
        bru.setVar("validToken", res.body.access_token);
        const parts = res.body.access_token.split(".");
        const tamperedPayload = Buffer.from(JSON.stringify({ sub: "attacker-admin", iss: "fake" }))
          .toString("base64")
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");
        bru.setVar("tamperedJwt", `${parts[0]}.${tamperedPayload}.${parts[2]}`);
    - type: tests
      code: |-
        test("Setup: Gueltiges M2M-Token erhalten", function() {
          expect(res.status).to.equal(200);
          expect(res.body.access_token).to.be.a("string");
        });
settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
