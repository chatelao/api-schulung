info:
  name: Delete Pet by ID
  type: http
  seq: 4
  tags:
    - crud
http:
  method: DELETE
  url: "{{baseURL}}/pet/{{petId}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("Pet wurde sauber geloescht", function() {
          expect(res.status).to.equal(200);
        });
settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
