info:
  name: Get Pet by ID (Chained)
  type: http
  seq: 3
  tags:
    - crud
http:
  method: GET
  url: "{{baseURL}}/pet/{{petId}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("Verkettete Pet-ID stimmt ueberein", function() {
          expect(res.status).to.equal(200);
          expect(String(res.body.id)).to.equal(String(bru.getVar("petId")));
          expect(res.body.name).to.equal("Bello");
        });
settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
