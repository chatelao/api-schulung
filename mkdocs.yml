site_name: "Praxis-Schulung API-Nutzung (Bruno, SoapUI, OpenAPI, SOAP, OAuth 2.1, OIDC & curl)"
site_description: "Einsteigerfreundlicher Lehrgang für REST/OpenAPI, SOAP/WSDL, WS-Security, OAuth 2.1 (RFC 9700) & OIDC sowie Advanced-Track für Shell, curl und CLI-Automatisierung"
site_url: "https://api-schulung.readthedocs.io/"
repo_url: "https://github.com/chatelao/api-schulung"
repo_name: "chatelao/api-schulung"

theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: In den Dark Mode wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: In den Light Mode wechseln
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - def_list

nav:
  - Start: index.md
  - Einstieg & Konzept:
      - Schnellstart (15 Min): quick-start.md
      - Lernpfade: learning-guide.md
      - Didaktisches Konzept: concept.md
      - "M00: Zero-Install-Start (Swagger UI)": setup/m00-setup.md
      - Roadmap: roadmap.md
      - KI-Leitplanken (AGENTS.md): agents.md
  - Basis-Lehrgang (M01–M12):
      - "Stufe 1 — Grundlagen (Swagger UI & GUI)":
          - "M01: HTTP-Fundament (Swagger Web UI)": module/M01.md
          - "M02: OpenAPI & Bruno Desktop": module/M02.md
          - "M03: SOAP 1.1/1.2 & WSDL in SoapUI": module/M03.md
          - "M04: Assertions, Chaining & Mocking": module/M04.md
      - "Stufe 2 — Transport- & Nachrichtensicherheit":
          - "M05: Credentials & Secret-Hygiene": module/M05.md
          - "M06: OpenAPI securitySchemes": module/M06.md
          - "M07: TLS, Custom CA & mTLS": module/M07.md
          - "M08: SOAP WS-Security (WSS)": module/M08.md
      - "Stufe 3 — OAuth 2.1 & OIDC":
          - "M09: OAuth 2.0 vs. RFC 9700 / 2.1": module/M09.md
          - "M10: OAuth-Praxis (PKCE & M2M)": module/M10.md
          - "M11: OIDC Discovery, JWKS & Tokens": module/M11.md
          - "M12: Token-Lifecycle & Security-Audits": module/M12.md
  - Übungen & Lösungen:
