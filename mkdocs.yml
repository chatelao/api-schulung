          - "Übung M02": uebungen/M02.md
          - "Übung M03": uebungen/M03.md
          - "Übung M04": uebungen/M04.md
          - "Übung M05": uebungen/M05.md
          - "Übung M06": uebungen/M06.md
          - "Übung M07": uebungen/M07.md
          - "Übung M08": uebungen/M08.md
          - "Übung M09": uebungen/M09.md
          - "Übung M10": uebungen/M10.md
          - "Übung M11": uebungen/M11.md
          - "Übung M12": uebungen/M12.md
      - "Musterlösungen (M01–M12)":
          - "Lösung M01": loesungen/M01.md
          - "Lösung M02": loesungen/M02.md
          - "Lösung M03": loesungen/M03.md
          - "Lösung M04": loesungen/M04.md
          - "Lösung M05": loesungen/M05.md
          - "Lösung M06": loesungen/M06.md
          - "Lösung M07": loesungen/M07.md
          - "Lösung M08": loesungen/M08.md
          - "Lösung M09": loesungen/M09.md
          - "Lösung M10": loesungen/M10.md
