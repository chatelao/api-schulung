worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream httpbin_backend {
        server go-httpbin:8080;
    }

    # Port 8444: Server-TLS mit lokaler Custom CA (ohne Client-Zertifikat)
    server {
        listen 8444 ssl;
        server_name localhost host.docker.internal tls-proxy;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://httpbin_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-TLS-Mode "server-tls-custom-ca";
        }
    }

    # Port 8443: Striktes Mutual TLS (mTLS) — Client-Zertifikat der Lab-CA zwingend erforderlich
    server {
        listen 8443 ssl;
        server_name localhost host.docker.internal tls-proxy;

        ssl_certificate        /etc/nginx/certs/server.crt;
        ssl_certificate_key    /etc/nginx/certs/server.key;
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client      on;
        ssl_verify_depth       2;
        ssl_protocols          TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://httpbin_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-TLS-Mode "mtls-verified";
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
            proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        }
    }
}
