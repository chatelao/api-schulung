services:
  petstore3:
    image: swaggerapi/petstore3:latest
    container_name: api-lab-petstore3
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v3/openapi.json >/dev/null 2>&1 || curl -fsS http://localhost:8080/api/v3/openapi.json >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6

  go-httpbin:
    image: ghcr.io/mccutchen/go-httpbin:latest
    container_name: api-lab-httpbin
    ports:
      - "8180:8080"
    restart: unless-stopped

  tls-proxy:
    image: nginx:1.27-alpine
    container_name: api-lab-tls-proxy
    depends_on:
      - go-httpbin
    ports:
      - "8443:8443"
      - "8444:8444"
    volumes:
      - ./tls-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/out:/etc/nginx/certs:ro
    restart: unless-stopped

  soap-service:
    build:
      context: ./soap-service
    container_name: api-lab-soap
    ports:
      - "9000:9000"
    environment:
      SOAP_WSS_USER: "${SOAP_WSS_USER:-lab-wss-user}"
      SOAP_WSS_PASS: "${SOAP_WSS_PASS:-CHANGE_ME_LAB_WSS_PASS}"
      LAB_CERT_DIR: "/certs"
    volumes:
      - ./certs/out:/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: api-lab-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-CHANGE_ME_LAB_ADMIN}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-import.json:/opt/keycloak/data/import/realm-import.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/api-lab/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.1
    container_name: api-lab-mock-oauth2
    ports:
      - "8090:8080"
    environment:
      JSON_CONFIG_PATH: "/config/config.json"
      SERVER_PORT: "8080"
    volumes:
      - ./mock-oauth2/config.json:/config/config.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/isalive >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
